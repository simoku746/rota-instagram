name: Hikâye yayınla
on:
  workflow_dispatch:
    inputs:
      klasor:
        description: 'Hikâye görsellerinin klasörü'
        default: 'stories/one-cikan'
jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/stories.py "${{ inputs.klasor }}"
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MEDIA_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
