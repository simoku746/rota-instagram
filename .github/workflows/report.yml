name: Haftalık Instagram raporu
on:
  schedule:
    - cron: '17 6 * * 1'   # her pazartesi 09:17 Türkiye saati
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency: { group: instagram-dm, cancel-in-progress: false }
jobs:
  rapor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: python3 scripts/weekly_report.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: Raporu kaydet ve bildir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "rota-bot"
          git config user.email "rota-bot@users.noreply.github.com"
          git add reports state
          git commit -m "Haftalık rapor" || true
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          gh issue create --title "${{ steps.r.outputs.baslik }}" --body-file "${{ steps.r.outputs.dosya }}" --assignee "${{ github.repository_owner }}" || gh issue create --title "${{ steps.r.outputs.baslik }}" --body-file "${{ steps.r.outputs.dosya }}"
