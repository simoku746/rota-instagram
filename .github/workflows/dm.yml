name: Yorumlara otomatik DM
on:
  schedule:
    - cron: '*/15 5-21 * * *'   # 08:00–00:45 Türkiye saati arası, 15 dakikada bir (GitHub geciktirebilir)
  workflow_dispatch:
    inputs:
      sadece_test:
        description: 'Hiçbir şey göndermeden tara (izinleri sınar)'
        type: boolean
        default: true
permissions:
  contents: write
concurrency: { group: instagram-dm, cancel-in-progress: false }
jobs:
  dm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/comment_dm.py ${{ (github.event_name == 'workflow_dispatch' && inputs.sadece_test) && 'test' || '' }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: Yanıtlanan yorumları kaydet
        run: |
          git config user.name "rota-bot"
          git config user.email "rota-bot@users.noreply.github.com"
          git add state || true
          git diff --cached --quiet && exit 0
          git commit -m "DM: yanıtlanan yorumlar"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
