name: Instagram'a paylaş
on:
  schedule:
    # Türkiye saatiyle 08:07–22:37 arası her yarım saatte bir. Her çalıştırma, zamanı gelmiş en eski
    # gönderiyi paylaşır (post.json "date" + "time"); zamanı gelen yoksa hiçbir şey yapmaz.
    # GitHub zamanlanmış işleri geciktirebilir; kaçan gönderi bir sonraki çalıştırmada çıkar.
    - cron: '7,37 5-19 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: instagram-publish, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pub
        run: python3 scripts/publish.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SECRET_A: ${{ secrets.ROTA }}
          SECRET_B: ${{ secrets.ROTA2 }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || '1370421786154860' }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          MEDIA_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Paylaşılanı posted/ klasörüne taşı
        if: steps.pub.outputs.folder != ''
        run: |
          git config user.name "rota-bot"
          git config user.email "rota-bot@users.noreply.github.com"
          mkdir -p posted
          git mv "queue/${{ steps.pub.outputs.folder }}" "posted/${{ steps.pub.outputs.folder }}"
          echo "${{ steps.pub.outputs.media_id }}" > "posted/${{ steps.pub.outputs.folder }}/MEDIA_ID"
          git add posted
          git commit -m "Paylaşıldı: ${{ steps.pub.outputs.folder }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
