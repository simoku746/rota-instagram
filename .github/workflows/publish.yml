name: Instagram'a paylaş
on:
  schedule:
    - cron: '30 9 * * *'   # her gün 12:30 Türkiye saati (09:30 UTC); GitHub birkaç dakika geç başlatabilir
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: instagram-publish, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pub
        run: python3 scripts/publish.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SECRET_A: ${{ secrets.ROTA }}
          SECRET_B: ${{ secrets.ROTA2 }}
          MEDIA_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Paylaşılanı posted/ klasörüne taşı
        if: steps.pub.outputs.folder != ''
        run: |
          git config user.name "rota-bot"
          git config user.email "rota-bot@users.noreply.github.com"
          mkdir -p posted
          git mv "queue/${{ steps.pub.outputs.folder }}" "posted/${{ steps.pub.outputs.folder }}"
          echo "${{ steps.pub.outputs.media_id }}" > "posted/${{ steps.pub.outputs.folder }}/MEDIA_ID"
          git add posted
          git commit -m "Paylaşıldı: ${{ steps.pub.outputs.folder }}"
          git push
